name: Android APK (Capacitor)

# Se lance automatiquement quand on modifie android-app/ ou ce fichier,
# et manuellement depuis l'onglet Actions > « Android APK (Capacitor) » > Run workflow.
on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '!android-app/icon.png'
      - 'js/aurore-auth-bootstrap.js'
      - 'js/aurore-personal-actions.js'
      - 'js/aurore-pdf-reader.js'
      - 'index.html'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      logo_png_url:
        description: 'URL publique du PNG carré du logo Eneles à utiliser comme icône APK'
        required: false
        type: string

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Composants Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Projet Capacitor (npm + plateforme Android)
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          npx cap add android

      - name: Retour de connexion Google (lien profond)
        working-directory: android-app
        run: |
          python3 - android/app/src/main/AndroidManifest.xml <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          f = '''<intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="app.vercel.aurore-section-archivescom.twa" android:host="auth" />
          </intent-filter>
          '''
          i = s.index('</activity>')
          open(p, 'w', encoding='utf-8').write(s[:i] + f + s[i:])
          PY
          grep -n "app.vercel.aurore-section-archivescom.twa" android/app/src/main/AndroidManifest.xml

      - name: Synchroniser le logo choisi dans Eneles vers l'icône Android
        env:
          LOGO_PNG_URL: ${{ inputs.logo_png_url || '' }}
        run: |
          if [ -n "$LOGO_PNG_URL" ]; then
            python3 - "$LOGO_PNG_URL" <<'PYURL'
          import re, sys
          from urllib.parse import urlparse
          u = urlparse(sys.argv[1])
          if u.scheme != "https" or u.hostname != "pub-0433751d08eb49fcafb7355ef0bf42ab.r2.dev":
              raise SystemExit("URL du logo refusée : hôte public R2 non autorisé.")
          if not re.fullmatch(r"/site-logo-[0-9]+-[a-z0-9]+-pdf\.png", u.path):
              raise SystemExit("URL du logo refusée : chemin PNG de logo inattendu.")
          PYURL
            curl --fail --location --silent --show-error --retry 3 "$LOGO_PNG_URL" -o "$RUNNER_TEMP/eneles-logo.png"
            python3 - "$RUNNER_TEMP/eneles-logo.png" "$GITHUB_WORKSPACE/android-app/icon.png" <<'PYPNG'
          import struct, sys
          from pathlib import Path
          source, target = map(Path, sys.argv[1:3])
          data = source.read_bytes()
          if len(data) < 33 or data[:8] != bytes.fromhex("89504e470d0a1a0a") or data[12:16] != b"IHDR":
              raise SystemExit("Le logo reçu n'est pas un PNG valide.")
          width, height = struct.unpack(">II", data[16:24])
          if width != 512 or height != 512:
              raise SystemExit(f"Le logo doit être carré en 512×512 px (reçu {width}×{height}).")
          target.write_bytes(data)
          print(f"Icône Android synchronisée : {width}×{height}, {len(data)} octets.")
          PYPNG
          else
            echo "Aucun logo transmis : conservation de l'icône du dépôt pour les lancements manuels classiques."
          fi

      - name: Enregistrer la nouvelle icône dans le dépôt
        if: ${{ inputs.logo_png_url != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/icon.png
          if git diff --cached --quiet; then
            echo "L'icône du dépôt correspond déjà au logo sélectionné."
          else
            git commit -m "chore(android): sync app icon with Eneles logo"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Icone et ecran de demarrage aux couleurs d'Aurore
        working-directory: android-app
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          RES=android/app/src/main/res
          IM=$(command -v magick || command -v convert)
          ICON="$GITHUB_WORKSPACE/android-app/icon.png"
          if [ ! -f "$ICON" ]; then
            ICON="$GITHUB_WORKSPACE/icon-512-1.png"
          fi
          test -f "$ICON" || { echo "Icône Eneles introuvable : $ICON"; exit 1; }
          echo "Icône source : $ICON"
          rm -rf "$RES/mipmap-anydpi-v26"
          for entry in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name="${entry%%:*}"; size="${entry##*:}"
            mkdir -p "$RES/mipmap-$name"
            "$IM" "$ICON" -resize "${size}x${size}" "$RES/mipmap-$name/ic_launcher.png"
            cp "$RES/mipmap-$name/ic_launcher.png" "$RES/mipmap-$name/ic_launcher_round.png"
            rm -f "$RES/mipmap-$name/ic_launcher_foreground.png"
          done
          find "$RES" -name 'splash.png' -delete
          mkdir -p "$RES/drawable"
          cat > "$RES/drawable/splash.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item><shape android:shape="rectangle"><solid android:color="#090812"/></shape></item>
            <item android:gravity="center"><bitmap android:gravity="center" android:src="@mipmap/ic_launcher"/></item>
          </layer-list>
          XML
          sed -i 's/^ *//' "$RES/drawable/splash.xml"

      - name: Numero de version
        working-directory: android-app
        run: |
          CODE=$((100 + VERSION_CODE))
          sed -i "s/versionCode 1/versionCode $CODE/; s/versionName \"1.0\"/versionName \"1.$CODE\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Compilation (release)
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Signature de l'APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(find android-app/android/app/build/outputs -name '*-unsigned.apk' | head -1)"
          echo "APK non signe : $UNSIGNED"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
            ALIAS="${KS_ALIAS:-aurore}"; PASS="$KS_PASS"; KEYPASS="${KS_KEY_PASS:-$KS_PASS}"
            echo "CLE=stable" >> "$GITHUB_ENV"
          else
            ALIAS=aurore; PASS="$(openssl rand -hex 16)"; KEYPASS="$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/ks.jks" -storetype PKCS12 -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Aurore, O=Aurore Section Archives, C=BF"
            echo "CLE=temporaire" >> "$GITHUB_ENV"
          fi
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$PASS" --key-pass "pass:$KEYPASS" \
            --out Aurore.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs Aurore.apk | head -3
          rm -f "$RUNNER_TEMP/ks.jks"

      - name: Resume
        run: |
          {
            echo "## APK Aurore (Capacitor)"
            echo ""
            echo "- Signature : **$CLE**"
            if [ "$CLE" = "temporaire" ]; then
              echo "- Cle generee pour cette compilation uniquement : cet APK ne pourra PAS etre mis a jour par un APK suivant (il faudra le desinstaller avant). Pour une cle stable, ajouter les secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS."
            fi
            echo "- Telechargement direct : Releases > apk-latest > Aurore.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Aurore-APK
          path: Aurore.apk
          retention-days: 14

      - name: Publication (lien de telechargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Aurore - APK (derniere version)
          body: "APK Android d'Aurore (Capacitor). Signature : ${{ env.CLE }}. Compilation n°${{ github.run_number }}."
          files: Aurore.apk
          prerelease: true
