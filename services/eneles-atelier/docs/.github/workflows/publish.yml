# On every push to main: check the pages, then ask the frontend repository to rebuild the site with them.
#
# Needs one repository secret: FRONTEND_DISPATCH_TOKEN, a fine-grained personal access token limited to the frontend repository with "Contents: Read and write" (that is the permission GitHub requires for sending a repository_dispatch event; the token is used for nothing else).
# Optional repository variable: FRONTEND_REPOSITORY, when the frontend is not at Eneles-org/frontend.
name: Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the pages
        run: node scripts/check.mjs

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Ask the frontend to redeploy
        env:
          TOKEN: ${{ secrets.FRONTEND_DISPATCH_TOKEN }}
          FRONTEND: ${{ vars.FRONTEND_REPOSITORY || 'Eneles-org/frontend' }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$FRONTEND/dispatches" \
            -d '{"event_type":"content-updated","client_payload":{"manual":"docs","sha":"${{ github.sha }}"}}'
