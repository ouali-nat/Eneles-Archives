name: Release

# Push a tag like v1.0.0 to build Eneles-PPT.exe and publish it as a GitHub
# Release. Manual runs (workflow_dispatch) build and upload the exe as a
# workflow artifact without creating a release — useful for testing a
# branch before cutting a real version.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install add-in dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: app

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build task pane + package the exe
        run: npm run release

      - name: Upload Eneles-PPT.exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eneles-PPT
          path: release/Eneles-PPT.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Eneles-PPT.exe
          generate_release_notes: true
